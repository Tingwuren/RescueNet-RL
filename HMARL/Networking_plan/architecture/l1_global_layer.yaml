# L1 决策逻辑层 — 全局资源与优先级
layer: L1
layer_name: 决策逻辑层
description: 根据灾害类型、残余网络状态、人口分布和业务优先级生成全局资源配置与组网策略

observation_dim: 27
output:
  type: quota_matrix
  shape: [10, 5]  # N_regions x M_device_types

device_inventory:
  emergency_bs: 10
  portable_gateway: 8
  relay_5g: 6
  mesh_relay: 12
  comm_uav: 4

priority_regions:
  - region_id: 0
    weight: 0.90
    label: 核心指挥区
  - region_id: 1
    weight: 0.70
    label: 重灾避难点
  - region_id: 2
    weight: 0.50
    label: 一般受灾区
  - region_id: 3
    weight: 0.30
    label: 边缘恢复区
  - region_id: 4
    weight: 0.20
    label: 低优先级区

hard_constraints:
  - column_sum_le_inventory
  - high_priority_region_min_quota_ratio: 0.25
  - max_deploy_per_inaccessible_road: 0

update_interval_hours: 24
