services:
  rescuenet:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
    container_name: rescuenet-rl
    environment:
      FRONTEND_DIST: /app/frontend/dist
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data/traces:/app/data/traces
    cap_add:
      - NET_ADMIN
    privileged: true
    restart: unless-stopped
